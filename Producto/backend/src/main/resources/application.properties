# =========================================================================
# CONFIGURACION GENERAL DE LA APLICACION
# =========================================================================
spring.application.name=erp_backend

# Puerto del servidor
server.port=8050

# Perfil activo
spring.profiles.active=dev

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.root=INFO

# Zona horaria
spring.jackson.time-zone=America/Santiago

# UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# =========================================================================
# BASE DE DATOS (MariaDB/MySQL XAMPP)
# =========================================================================
spring.datasource.url=jdbc:mariadb://localhost:3306/BD_ERP?useSSL=false
spring.datasource.driverClassName=org.mariadb.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# =========================================================================
# JPA / HIBERNATE
# =========================================================================
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=never

# =========================================================================
# FLYWAY
# =========================================================================
spring.flyway.enabled=false

# -------------------------------------------------------------------------
# DOCUMENTACION DE LA API (SWAGGER / OPENAPI)
# -------------------------------------------------------------------------
# URL de acceso a la interfaz grafica: http://localhost:8050/swagger-ui/index.html
