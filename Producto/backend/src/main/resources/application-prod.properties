# ============================================================================
# PERFIL PROD — MySQL (InnoDB)
# ============================================================================
# Activar con: SPRING_PROFILES_ACTIVE=prod  (o -Dspring.profiles.active=prod)
# Las credenciales se inyectan por variables de entorno; los valores tras ":"
# son defaults para un MySQL local.
# ============================================================================

server.port=${PORT:8050}

# ----------------------
# BASE DE DATOS (MySQL)
# ----------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/erp_db?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.platform=mysql
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.jpa.defer-datasource-initialization=true

# Hibernate sigue creando el esquema (mismo patrón que dev); Flyway agrega
# luego las FKs/índices que Hibernate no maneja.
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# ----------------------
# FLYWAY
# ----------------------
# En prod Hibernate (ddl-auto=update) gestiona el schema base y data-mysql.sql
# siembra los datos. Flyway corre DESPUES (ver FlywayConfig.java, ApplicationRunner
# manual para evitar el circular depends-on de Spring Boot 3) para agregar las
# FKs/columnas/tablas que Hibernate no gestiona. spring.flyway.enabled se mantiene
# en false a propósito: es lo que desactiva el autoarranque estándar de Spring Boot
# para que FlywayConfig controle el timing manualmente.
spring.flyway.enabled=false
flyway.manual.enabled=true

# ----------------------
# LOGGING
# ----------------------
logging.level.org.hibernate.SQL=INFO
logging.level.root=INFO
spring.jackson.time-zone=America/Santiago
