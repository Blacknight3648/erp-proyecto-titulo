# Configuracion de las pruebas E2E
# URL base del frontend (Vite dev server)
base.url=http://localhost:5173

# Ejecutar el navegador sin interfaz grafica (true en CI, false para depurar)
headless=true

# Timeout (segundos) para las esperas explicitas
timeout.seconds=15

# Credenciales del frontend (autenticacion en memoria: admin/admin)
login.user=admin
login.password=admin
