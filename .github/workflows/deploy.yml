name: CI/CD - Deploy to AWS EC2

on:
  push:
    branches:
      - deploy

env:
  DOCKER_USER: blacknight3648

jobs:
  build-and-push:
    name: Build & Push to Docker Hub
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./Producto/backend
          file: ./Producto/backend/Dockerfile
          push: true
          tags: ${{ env.DOCKER_USER }}/erp-backend:latest

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./Producto/frontend
          file: ./Producto/frontend/Dockerfile
          push: true
          tags: ${{ env.DOCKER_USER }}/erp-frontend:latest

  deploy-backend:
    name: Deploy Backend + DB to Private EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Fetch EC2 IPs from AWS API
        id: get-ips
        run: |
          PUBLIC_IP=$(aws ec2 describe-instances --instance-ids ${{ vars.EC2_PUBLIC_INSTANCE_ID }} --query "Reservations[0].Instances[0].PublicIpAddress" --output text)
          PRIVATE_IP=$(aws ec2 describe-instances --instance-ids ${{ vars.EC2_PRIVATE_INSTANCE_ID }} --query "Reservations[0].Instances[0].PrivateIpAddress" --output text)
          echo "public_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT
          echo "private_ip=$PRIVATE_IP" >> $GITHUB_OUTPUT

      - name: Create app directory on Private EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.get-ips.outputs.private_ip }}
          username: ${{ vars.EC2_PRIVATE_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_SSH_KEY }}
          proxy_host: ${{ steps.get-ips.outputs.public_ip }}
          proxy_username: ${{ vars.EC2_PUBLIC_USERNAME }}
          proxy_key: ${{ secrets.EC2_PUBLIC_SSH_KEY }}
          script: mkdir -p ~/app

      - name: Copy docker-compose.backend.yml to Private EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.get-ips.outputs.private_ip }}
          username: ${{ vars.EC2_PRIVATE_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_SSH_KEY }}
          proxy_host: ${{ steps.get-ips.outputs.public_ip }}
          proxy_username: ${{ vars.EC2_PUBLIC_USERNAME }}
          proxy_key: ${{ secrets.EC2_PUBLIC_SSH_KEY }}
          source: "./Producto/docker-compose.backend.yml"
          target: "~/app"
          strip_components: 1

      - name: Deploy Backend on Private EC2 via SSH Proxy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.get-ips.outputs.private_ip }}
          username: ${{ vars.EC2_PRIVATE_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_SSH_KEY }}
          proxy_host: ${{ steps.get-ips.outputs.public_ip }}
          proxy_username: ${{ vars.EC2_PUBLIC_USERNAME }}
          proxy_key: ${{ secrets.EC2_PUBLIC_SSH_KEY }}
          script_stop: true
          script: |
            cd ~/app
            
            # Crear archivo .env local para la orquestación en producción
            echo "DOCKER_USER=${{ env.DOCKER_USER }}" > .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}" >> .env
            
            # Login a Docker Hub en el servidor privado
            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
            
            # Descargar las imágenes nuevas y levantar
            docker-compose -f docker-compose.backend.yml pull
            docker-compose -f docker-compose.backend.yml up -d --remove-orphans
            
            # Limpiar imágenes huérfanas para ahorrar espacio
            docker image prune -f

  deploy-frontend:
    name: Deploy Frontend to Public EC2
    runs-on: ubuntu-latest
    needs: deploy-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Fetch EC2 IPs from AWS API
        id: get-ips
        run: |
          PUBLIC_IP=$(aws ec2 describe-instances --instance-ids ${{ vars.EC2_PUBLIC_INSTANCE_ID }} --query "Reservations[0].Instances[0].PublicIpAddress" --output text)
          PRIVATE_IP=$(aws ec2 describe-instances --instance-ids ${{ vars.EC2_PRIVATE_INSTANCE_ID }} --query "Reservations[0].Instances[0].PrivateIpAddress" --output text)
          echo "public_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT
          echo "private_ip=$PRIVATE_IP" >> $GITHUB_OUTPUT

      - name: Create app directory on Public EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.get-ips.outputs.public_ip }}
          username: ${{ vars.EC2_PUBLIC_USERNAME }}
          key: ${{ secrets.EC2_PUBLIC_SSH_KEY }}
          script: mkdir -p ~/app

      - name: Copy docker-compose.frontend.yml to Public EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.get-ips.outputs.public_ip }}
          username: ${{ vars.EC2_PUBLIC_USERNAME }}
          key: ${{ secrets.EC2_PUBLIC_SSH_KEY }}
          source: "./Producto/docker-compose.frontend.yml"
          target: "~/app"
          strip_components: 1

      - name: Deploy Frontend on Public EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.get-ips.outputs.public_ip }}
          username: ${{ vars.EC2_PUBLIC_USERNAME }}
          key: ${{ secrets.EC2_PUBLIC_SSH_KEY }}
          script_stop: true
          script: |
            cd ~/app
            
            # Crear archivo .env local para la orquestación en producción
            echo "DOCKER_USER=${{ env.DOCKER_USER }}" > .env
            echo "BACKEND_API_URL=http://${{ steps.get-ips.outputs.private_ip }}:8050" >> .env
            
            # Login a Docker Hub en el servidor público
            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
            
            # Descargar las imágenes nuevas y levantar
            docker-compose -f docker-compose.frontend.yml pull
            docker-compose -f docker-compose.frontend.yml up -d --remove-orphans
            
            # Limpiar imágenes huérfanas para ahorrar espacio
            docker image prune -f
