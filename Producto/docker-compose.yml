services:

  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: erp_db
    networks:
      - network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp-backend
    ports:
      - "8050:8050"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/erp_db?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
      DB_USER: root
      DB_PASSWORD: root_password
      SPRING_JACKSON_TIME_ZONE: America/Santiago
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8050/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8050
    container_name: erp-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - network

networks:
  network:
    driver: bridge
