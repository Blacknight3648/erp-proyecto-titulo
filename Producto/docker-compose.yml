services:

  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: [PASSWORD]
    networks:
      - network
  networks:
    network:
      driver: bridge

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp-backend
    ports:
      - "8050:8050"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_JACKSON_TIME_ZONE: America/Santiago
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8050/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: erp-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
