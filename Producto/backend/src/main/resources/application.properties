# =========================================================================
# CONFIGURACION GENERAL DE LA APLICACION
# =========================================================================
spring.application.name=erp_backend

# Puerto del servidor
server.port=8050

# Perfil activo por defecto (Desarrollo Local con H2 en Memoria)
spring.profiles.active=dev

# -------------------------------------------------------------------------
# INTERNACIOLIZACION, CODIFICACION Y FORMATOS
# -------------------------------------------------------------------------
spring.jackson.time-zone=America/Santiago

# Forzar codificacion UTF-8 para evitar problemas de caracteres especiales
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# -------------------------------------------------------------------------
# TRAZAS Y LOGGING
# -------------------------------------------------------------------------
logging.level.root=INFO
logging.level.org.hibernate.SQL=DEBUG

# =========================================================================
# PERSISTENCIA Y BASE DE DATOS (H2 EN MEMORIA)
# =========================================================================
# Consola H2 habilitada en: http://localhost:8050/h2-console
spring.h2.console.enabled=true

# Configuracion de la conexion JDBC
spring.datasource.url=jdbc:h2:mem:antuandb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa

# Configuracion de Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Configuracion de inicializacion de scripts SQL alternativos
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# =========================================================================
# MIGRACIONES DE BASE DE DATOS (FLYWAY)
# =========================================================================
# Deshabilitamos el ciclo de vida automatico de Flyway para invertir el orden estandar:
# Por defecto, Spring ejecuta Flyway ANTES de Hibernate. Sin embargo, dado que delegamos
# la creacion inicial de las tablas en Hibernate (ddl-auto=update), requerimos que 
# Flyway se ejecute DESPUES de que el contexto de JPA este completamente listo.
# La ejecucion se controla programaticamente en 'FlywayConfig.java' usando 
# @DependsOn("entityManagerFactory") para gatillar el metodo .migrate().
spring.flyway.enabled=false

# -------------------------------------------------------------------------
# DOCUMENTACION DE LA API (SWAGGER / OPENAPI)
# -------------------------------------------------------------------------
# URL de acceso a la interfaz grafica: http://localhost:8050/swagger-ui/index.html