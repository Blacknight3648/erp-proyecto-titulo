# =========================================================================
# CONFIGURACION EXCLUSIVA PARA ENTORNO DE PRUEBAS (APPLICATION-TEST.PROPERTIES)
# =========================================================================

# 1. DESACTIVAR SEGURIDAD EN TESTS (Evita errores 401 y 403 en MockMvc)
# Si usas Spring Security, esto desactiva la verificacion de filtros en el contexto de test
spring.security.enabled=false
management.security.enabled=false

# 2. BASE DE DATOS LOCAL SANA PARA TEST (H2 en memoria limpia por cada suite)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa

# 3. CONTROL DE ESTRATEGIA JPA / HIBERNATE
# 'create-drop' asegura que la base de datos se cree y se destruya en cada ejecucion de prueba
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# 4. EVITAR CONFLICTOS CON SCRIPTS INICIALES
# Desactiva la inicializacion de datos por defecto para que no choque con tus entidades de prueba
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# 5. ASEGURAR QUE FLYWAY NO INTERFIERA EN LOS TESTS
# Al igual que en desarrollo, lo apagamos para que no busque migraciones pendientes durante el test unitario
spring.flyway.enabled=false