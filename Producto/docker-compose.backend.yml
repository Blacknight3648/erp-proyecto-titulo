services:

  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: erp_db
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -uroot -p${MYSQL_ROOT_PASSWORD:-root_password} || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - network

  backend:
    image: ${DOCKER_USER}/erp-backend:latest
    container_name: erp-backend
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8050:8050"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/erp_db?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root_password}
      SPRING_JACKSON_TIME_ZONE: America/Santiago
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8050/actuator/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - network

networks:
  network:
    driver: bridge
