# =========================================================================
# CONFIGURACION GENERAL DE LA APLICACION
# =========================================================================
spring.application.name=erp_backend

# Puerto del servidor
server.port=8050

# Perfil activo
spring.profiles.active=dev

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.root=INFO

# Zona horaria
spring.jackson.time-zone=America/Santiago
spring.jackson.serialization.write-dates-as-timestamps=false

# UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# =========================================================================
# BASE DE DATOS (MySQL)
# =========================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/BD_ERP?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# =========================================================================
# JPA / HIBERNATE
# =========================================================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=always
spring.sql.init.platform=mysql
spring.jpa.defer-datasource-initialization=true

# =========================================================================
# FLYWAY
# =========================================================================
spring.flyway.enabled=false

# -------------------------------------------------------------------------
# DOCUMENTACION DE LA API (SWAGGER / OPENAPI)
# -------------------------------------------------------------------------
# URL de acceso a la interfaz grafica: http://localhost:8050/swagger-ui/index.html
